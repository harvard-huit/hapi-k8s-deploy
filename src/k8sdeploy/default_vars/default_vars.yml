# Default all deploy types
deploy_type: api
target_image_registry: {{ ecr_account_id }}.dkr.ecr.us-east-1.amazonaws.com
target_image_name: {{ target_app_name }}
target_image_tag: ''
target_replica_count: 3
target_namespace: default
# Resource constraints (opt-in, backward compatible).
# Leave target_set_resources False to render exactly as before (no resources block).
# Set it True to apply requests/limits; unset sub-values fall back to these defaults.
# CPU limit is intentionally omitted by default to avoid throttling; set target_cpu_limit to add one.
target_set_resources: False
target_cpu_request: 100m
target_memory_request_mb: 256
target_memory_limit_mb: 512
target_cpu_limit: ''
# Service default create
create_service: True
# Ingress
# Default to not create Ingress
create_ingress: False
aws_load_balancer_backend_protocol: HTTPS
ingress_group_order: '0'
ingress_inbound_security_groups: sg-0d3081250fed98f00,sg-087fd3cc5c488e2db
ingress_tags: "Name={{ ingress_load_balancer_name }},dms_app_family=adex,dms_service=adex,dms_stack={{ stack }},environment={{ environment }},huit_assetid=9301,product=adexk8s,waf-type=external-alb"
ingress_additional_tags: 'waf-type=exception-alb,waf-custom=exclude-xss,waf-exception-request=INC05865698-INC05634592'
# Ingress group defaults to ingress_load_balancer_name
ingress_path: /
ingress_group_name: {{ ingress_load_balancer_name }}
ingress_health_check_path: /
successful_response_codes: '200'

#CronJob or Job Variable
job_command: []
job_interval: ''
restart_policy: OnFailure
backoff_limit: 6
concurrency_policy: Allow

# Volume Mount
default_mode: 420

# Sidecar
sidecar_name: 'sidecar'
sidecar_image: ''
sidecar_pull_policy: IfNotPresent
# Extra sidecar containers (opt-in). Empty by default so deployments that do not
# set target_sidecars render exactly as before. Each entry supports:
#   name, image (or repo+tag prefixed with target_image_registry), pull_policy,
#   command (list, overrides the image entrypoint -- args alone cannot),
#   args (list), env (list of {name, value}),
#   ports (list of {container_port, name, protocol}),
#   volume_mounts (list of {name, mount_path, read_only}), which must name a
#     volume the deployment already defines via target_volume_mount,
#   set_resources + cpu_request/memory_request_mb/memory_limit_mb.
target_sidecars: []

# Health probes, shutdown and rollout pacing. All opt-in: every value here is
# empty, so a deployment that sets none of them renders exactly as before.
#
# Without a readinessProbe a pod is added to the Service the moment its
# container starts -- before the server has bound its socket -- so a rolling
# update serves 502s while replacements come up. Set the path to fix that.
#
# Keep probes SHALLOW. They should answer "is this process serving", not "are
# my dependencies healthy". A probe that checks a database fails every pod at
# once when that database blips, turning degradation into an outage.
target_readiness_probe_path: ''
target_liveness_probe_path: ''
target_startup_probe_path: ''
# Defaults to target_app_port. Set scheme to HTTPS when the app terminates TLS
# itself -- an HTTP probe against an HTTPS listener fails and the pod never
# becomes ready.
target_probe_port: ''
target_probe_scheme: 'HTTP'
target_probe_timeout: 3
target_readiness_initial_delay: 3
target_readiness_period: 5
target_readiness_failure_threshold: 3
target_liveness_initial_delay: 30
target_liveness_period: 20
target_liveness_failure_threshold: 3
target_startup_period: 3
target_startup_failure_threshold: 30

# Seconds between endpoint removal and SIGTERM, so in-flight requests finish
# rather than being cut.
target_prestop_sleep_seconds:
# Explicit preStop command, for a custom drain or a cluster older than 1.32
# where the native sleep action is unavailable. Overrides the sleep above.
# Each list item is one argv element, not a shell line: kubelet executes the
# array directly and does NOT invoke a shell. Only wrap in /bin/sh -c if you
# actually need shell features, and only if the image has a shell.
target_prestop_command: []

# Must exceed the app's own graceful shutdown. Kubernetes defaults to 30s and
# SIGKILLs at that point, cutting a longer drain short.
target_termination_grace_seconds:

# Rolling update pacing. Left unset, Kubernetes uses 25%/25%, which removes
# serving pods before replacements can serve. maxUnavailable: 0 never dips
# below capacity. Note 0 is a meaningful value, so these are checked against
# none rather than for truthiness.
target_max_unavailable:
target_max_surge:
target_min_ready_seconds:

